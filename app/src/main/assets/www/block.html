<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App paused</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="block-page">

<div class="bg" aria-hidden="true">
  <div class="orb o1" style="left:-10%;top:4%;width:420px;height:420px"></div>
  <div class="orb o2"></div>
  <svg class="grain"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>

<main class="block">
  <span class="label-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-3.2-6.15"/><circle cx="18.5" cy="5.5" r="1.6" fill="currentColor" stroke="none"/></svg><span id="label">Smart Blocker</span></span>
  <div class="halo" aria-hidden="true">
    <span class="wave"></span><span class="wave"></span><span class="wave"></span>
    <div class="glass app-orb" id="letter"></div>
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span>
  </div>
  <h1 id="title">This app is paused</h1>
  <p class="detail" id="detail"></p>
  <div class="countdown">
    <span class="clock" id="clock" role="timer">0:00:00</span>
    <span class="cap">until it opens</span>
  </div>
</main>

<footer class="actions" id="actions"></footer>

<script>
'use strict';
/* The block screen. Kotlin (BlockActivity.kt) calls setData({...}) with the app and the reason. */
const Native = window.Android || {
  close() { console.log('In the app this goes to the home screen.'); },
  snooze() { console.log('In the app this opens the app for 5 minutes.'); return true; },
  openApp() {}
};
const $ = (s) => document.querySelector(s);
let D = null;          // data about the blocked app
let phase = 'idle';    // 'idle' | 'wait' | 'ready' | 'free'
let wait = 10;
let waitTimer = null;

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function snoozeText(n) { return n === 1 ? '1 snooze left today' : n + ' snoozes left today'; }

window.setData = function (data) {
  D = data;
  phase = 'idle';
  clearInterval(waitTimer);
  $('#label').textContent = D.label || 'Smart Blocker';
  $('#letter').textContent = (D.name || '?').charAt(0).toUpperCase();
  $('#title').textContent = D.title || 'This app is paused';
  $('#detail').textContent = D.detail || '';
  tick();
  drawActions();
};

function tick() {
  if (!D) return;
  const ms = Math.max(0, Number(D.until) - Date.now());
  const s = Math.floor(ms / 1000);
  $('#clock').textContent = Math.floor(s / 3600) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  if (ms === 0 && phase !== 'free') { phase = 'free'; drawActions(); }
}
setInterval(tick, 1000);

function drawActions() {
  const a = $('#actions');
  const name = esc(D.name || 'this app');
  if (phase === 'free') {
    a.innerHTML = '<p class="muted center">You can open ' + name + ' again.</p>' +
      '<button class="btn-primary" data-a="close">Back to home</button>';
    return;
  }
  if (phase === 'wait') {
    a.innerHTML = '<div class="wait"><span class="wait-ring">' +
      '<svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>' +
      '<circle id="waitArc" class="wait-arc" cx="64" cy="64" r="54" fill="none" stroke="#f4f4f5" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" transform="rotate(-90 64 64)" style="stroke-dashoffset:0px"/></svg>' +
      '<span class="wait-num" id="waitNum" aria-live="polite">' + wait + '</span></span>' +
      '<span class="t" id="breath">Breathe in slowly…</span>' +
      '<button class="btn-text" data-a="cancel">Cancel</button></div>';
    return;
  }
  if (phase === 'ready') {
    a.innerHTML = '<button class="glass btn-glass" data-a="snooze">Open ' + name + ' for 5 minutes</button>' +
      '<button class="btn-primary sheen" data-a="close">Never mind, close it</button>' +
      '<p class="muted small center">' + snoozeText(D.left) + '</p>';
    return;
  }
  let extra = '';
  if (D.snooze && D.left > 0) {
    extra = '<button class="btn-text" data-a="need">I really need it</button><p class="muted small center">' + snoozeText(D.left) + '</p>';
  } else {
    extra = '<p class="muted small center">' + (D.left > 0 ? 'Snoozes are off for this one.' : 'No snoozes left today.') + '</p>';
  }
  a.innerHTML = '<button class="btn-primary sheen" data-a="close">Close ' + name + '</button>' + extra;
}

function setArc() {
  const arc = $('#waitArc');
  if (arc) arc.style.strokeDashoffset = (339.29 * (1 - wait / 10)).toFixed(2) + 'px';
}

const actions = {
  close() { Native.close(); },
  need() {
    phase = 'wait';
    wait = 10;
    drawActions();
    clearInterval(waitTimer);
    waitTimer = setInterval(() => {
      wait -= 1;
      if (wait <= 0) {
        clearInterval(waitTimer);
        phase = 'ready';
        drawActions();
        return;
      }
      $('#waitNum').textContent = wait;
      $('#breath').textContent = wait > 5 ? 'Breathe in slowly…' : '…and breathe out';
      setArc();
    }, 1000);
  },
  cancel() { clearInterval(waitTimer); phase = 'idle'; drawActions(); },
  snooze() {
    const ok = Native.snooze();
    if (!ok) {
      D.snooze = false;
      D.left = 0;
      phase = 'idle';
      drawActions();
    }
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el && actions[el.dataset.a]) actions[el.dataset.a]();
});

/* In a normal browser, show example data so you can work on the design. */
if (!window.Android) {
  window.setData({
    pkg: 'com.zhiliaoapp.musically', name: 'TikTok', title: 'TikTok is paused',
    detail: 'Your Study block keeps it closed until 13:00.', label: 'Study',
    until: Date.now() + 6128000, snooze: true, left: 3
  });
}
</script>
</body>
</html>
